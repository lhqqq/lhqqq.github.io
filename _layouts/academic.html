<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.url != '/' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | escape }}">
    <meta name="theme-color" content="#20212b">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/images/profile.jpg' | absolute_url }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
    <script src="{{ '/assets/js/academic.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
        <nav class="site-navigation" aria-label="Main navigation">
          {% for link in site.data.navigation.main %}
          <a href="{{ link.url | relative_url }}"{% if page.url == '/' %} data-section="{{ link.url | split: '#' | last }}"{% endif %}>{{ link.title }}</a>
          {% endfor %}
        </nav>
      </div>
    </header>
    <main id="main" class="site-main" tabindex="-1">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="footer-inner">
        <p>© {{ site.time | date: '%Y' }} {{ site.author.name }} <span aria-hidden="true">·</span> Arlington, Texas</p>
        <a href="mailto:{{ site.author.email }}">Get in touch</a>
      </div>
    </footer>
  </body>
</html>
